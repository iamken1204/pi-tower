<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fcf9f7">
  <title>Pi Tower · Runners</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body class="runners-page" data-authenticated="false" data-connection="disconnected">
  <a class="skip-link" href="#main-content">跳至 Runners</a>
  <div class="app" id="app">
    <aside class="sidebar" id="thread-sidebar" aria-label="主要導覽" tabindex="-1">
      <header class="sidebar-header"><a class="brand" href="/threads"><span class="brand-mark" aria-hidden="true">π</span><b>tower</b></a><button class="icon-button mobile-close" data-close-panel type="button" aria-label="關閉導覽">×</button></header>
      <p class="runner-sidebar-copy">連線至你的 Runner，接著回到工作中的對話。</p>
      <dl class="metrics" aria-label="連線統計"><div class="metric"><dt>已連線 Runner</dt><dd id="runner-count">00</dd></div><div class="metric"><dt>已啟用對話</dt><dd id="thread-count">00</dd></div></dl>
      <div class="sidebar-bottom"><nav class="sidebar-footer" aria-label="主要導覽"><a class="footer-tab" href="/threads">對話</a><a class="footer-tab active" href="/" aria-current="page">Runners</a></nav><div class="account-row"><span class="avatar" aria-hidden="true">T</span><span class="account-name">Tower<small>pi-tower state</small></span><button id="logout" class="text-button" type="button">登出</button></div></div>
    </aside>
    <main class="main-panel" id="main-content" tabindex="-1">
      <header class="main-header"><button class="icon-button" id="sidebar-toggle" type="button" aria-controls="thread-sidebar" aria-expanded="true" aria-label="切換導覽" title="切換導覽">☰</button><h1>Runners</h1><div class="main-header-actions"><time class="header-clock" id="clock" datetime=""></time><details class="connection-menu" id="auth-details" open><summary><span class="connection-indicator" id="connection-indicator">尚未連線</span></summary><div class="connection-popover"><form class="auth-form" id="auth-form" method="post" action="/api/session"><div class="field"><label for="token">存取權杖</label><input id="token" name="token" type="password" required autocomplete="off" spellcheck="false" placeholder="輸入 Tower 權杖"></div><button class="primary-button" type="submit">連線</button></form><p class="auth-note" id="connection-summary">在此裝置登入 Tower。</p></div></details></div></header>
      <section class="status-strip" aria-label="連線狀態"><p id="status" role="status" aria-live="polite" data-kind="idle">正在連線至 Tower…</p><span id="polling-note">等待即時更新</span></section>
      <div class="runner-page-scroll"><section class="runners-inner" aria-labelledby="directory-title"><header class="directory-heading"><div class="directory-title"><h2 id="directory-title">你的 Runners</h2><p class="results-note" id="results-note" aria-live="polite">登入後即可查看可用的 Runner。</p></div><button class="secondary-button" id="refresh-button" type="button" disabled>重新整理</button><div class="filter-field"><label for="runner-filter">搜尋</label><input id="runner-filter" type="search" maxlength="100" placeholder="搜尋 Runner 或對話" disabled><kbd>⌘K</kbd></div></header><div id="runners"><div class="empty-state"><div class="empty-copy"><strong>等待連線</strong><p>已連線的 Runner 及對話會顯示在這裡。</p></div></div></div></section></div>
    </main>
  </div>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

<script>
		const form = document.querySelector("#auth-form");
		const authDetails = document.querySelector("#auth-details");
		const input = document.querySelector("#token");
		const status = document.querySelector("#status");
		const pollingNote = document.querySelector("#polling-note");
		const connectionIndicator = document.querySelector("#connection-indicator");
		const connectionSummary = document.querySelector("#connection-summary");
		const filterInput = document.querySelector("#runner-filter");
		const refreshButton = document.querySelector("#refresh-button");
		const resultsNote = document.querySelector("#results-note");
		const container = document.querySelector("#runners");
		const counts = {
			runners: document.querySelector("#runner-count"),
			threads: document.querySelector("#thread-count"),
		};
		const authFailed = new URLSearchParams(location.search).get("auth") === "failed";
		let timer;
		let stream;
		let pollId = 0;
		let latestData = { runners: [] };
		let selectedRunnerId = null;

		const padCount = (value) => String(value).padStart(2, "0");
		const plural = (count, noun) => `${count} ${noun === "thread" ? "段對話" : noun === "session" ? "個工作階段" : "個 Runner"}`;
		// Rows under a runner are active threads plus, on legacy relay runners, live pi sessions.
		const threadCount = (sessions) => sessions.filter((session) => session.managed).length;
		const rowsLabel = (sessions) => {
			const threads = threadCount(sessions);
			const legacy = sessions.length - threads;
			return [threads && plural(threads, "thread"), legacy && plural(legacy, "session")].filter(Boolean).join(", ");
		};
		const dateTime = (value) => new Intl.DateTimeFormat(undefined, {
			year: "numeric",
			month: "short",
			day: "numeric",
			hour: "2-digit",
			minute: "2-digit",
			second: "2-digit",
		}).format(new Date(value));
		const elapsed = (value) => {
			const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
			const days = Math.floor(seconds / 86400);
			const hours = Math.floor((seconds % 86400) / 3600);
			const minutes = Math.floor((seconds % 3600) / 60);
			return `${days ? `${days}d ` : ""}${hours}h ${minutes}m`;
		};

		function setStatus(message, kind = "idle") {
			if (status.textContent !== message) status.textContent = message;
			status.dataset.kind = kind;
		}

		function setConnection(state) {
			document.body.dataset.connection = state;
			const settings = {
				disconnected: ["尚未連線", "需要存取權杖"],
				connecting: ["連線中", "正在檢查權杖…"],
				connected: ["已連線", "已連線 · 展開以更換權杖"],
				degraded: ["重新連線中", "連線中斷 · 正在重試"],
			};
			[connectionIndicator.textContent, connectionSummary.textContent] = settings[state];
		}

		function setCounts(runners = []) {
			counts.runners.textContent = padCount(runners.length);
			counts.threads.textContent = padCount(threadCount(runners.flatMap((runner) => runner.sessions)));
		}

		function renderEmpty(title, message, code = "R–000") {
			const empty = document.createElement("div");
			empty.className = "empty-state";
			const marker = document.createElement("span");
			marker.className = "empty-code";
			marker.textContent = code;
			const copy = document.createElement("div");
			copy.className = "empty-copy";
			const heading = document.createElement("strong");
			heading.textContent = title;
			const detail = document.createElement("p");
			detail.textContent = message;
			copy.append(heading, detail);
			empty.append(marker, copy);
			container.replaceChildren(empty);
		}

		function normalizeSearch(value) {
			return value
				.normalize("NFKD")
				.replace(/[\u0300-\u036f]/g, "")
				.toLowerCase()
				.trim();
		}

		function compactSearch(value) {
			return normalizeSearch(value).replace(/[\s\-_./]+/g, "");
		}

		function editDistance(left, right) {
			let previous = Array.from({ length: right.length + 1 }, (_, index) => index);
			for (let leftIndex = 0; leftIndex < left.length; leftIndex += 1) {
				const current = [leftIndex + 1];
				for (let rightIndex = 0; rightIndex < right.length; rightIndex += 1) {
					current.push(Math.min(
						current[rightIndex] + 1,
						previous[rightIndex + 1] + 1,
						previous[rightIndex] + (left[leftIndex] === right[rightIndex] ? 0 : 1),
					));
				}
				previous = current;
			}
			return previous[right.length];
		}

		function fuzzyTermScore(term, candidate) {
			const needle = compactSearch(term);
			const normalizedCandidate = normalizeSearch(candidate);
			const haystack = compactSearch(candidate);
			if (!needle || !haystack) return null;

			const exactIndex = haystack.indexOf(needle);
			let bestScore = exactIndex < 0
				? null
				: 2000 - exactIndex * 5 - Math.max(0, haystack.length - needle.length);

			let cursor = -1;
			let firstMatch = 0;
			let previousMatch = -2;
			let subsequenceScore = 1200;
			for (let index = 0; index < needle.length; index += 1) {
				const match = haystack.indexOf(needle[index], cursor + 1);
				if (match < 0) {
					subsequenceScore = null;
					break;
				}
				if (index === 0) firstMatch = match;
				subsequenceScore += match === previousMatch + 1 ? 30 : 12;
				subsequenceScore -= Math.max(0, match - previousMatch - 1) * 3;
				cursor = match;
				previousMatch = match;
			}
			if (subsequenceScore !== null) {
				subsequenceScore -= firstMatch * 4 + Math.max(0, haystack.length - needle.length);
				bestScore = Math.max(bestScore ?? -Infinity, subsequenceScore);
			}

			const tolerance = needle.length <= 2 ? 0 : needle.length <= 5 ? 1 : 2;
			const words = normalizedCandidate.split(/[\s\-_./]+/).filter(Boolean);
			words.forEach((word, wordIndex) => {
				const compactWord = compactSearch(word);
				if (Math.abs(compactWord.length - needle.length) > tolerance) return;
				const distance = editDistance(needle, compactWord);
				if (distance > tolerance) return;
				const score = 900 - distance * 120 - wordIndex * 4;
				bestScore = Math.max(bestScore ?? -Infinity, score);
			});

			return bestScore;
		}

		function fuzzyScore(query, candidate) {
			const terms = normalizeSearch(query).split(/[\s\-_./]+/).filter(Boolean);
			if (!terms.length) return null;
			const scores = terms.map((term) => fuzzyTermScore(term, candidate));
			return scores.some((score) => score === null)
				? null
				: scores.reduce((total, score) => total + score, 0);
		}

		function visibleRunners(runners) {
			const query = filterInput.value.trim();
			if (!query) return runners;

			return runners
				.map((runner, index) => {
					const runnerScore = fuzzyScore(query, runner.id);
					const sessionMatches = runner.sessions
						.map((session) => ({ session, score: fuzzyScore(query, session.name) }))
						.filter(({ score }) => score !== null)
						.sort((left, right) => right.score - left.score);
					if (runnerScore === null && !sessionMatches.length) return null;
					return {
						index,
						score: Math.max(runnerScore ?? -Infinity, sessionMatches[0]?.score ?? -Infinity),
						runner: runnerScore === null
							? { ...runner, sessions: sessionMatches.map(({ session }) => session) }
							: runner,
					};
				})
				.filter(Boolean)
				.sort((left, right) => right.score - left.score || left.index - right.index)
				.map(({ runner }) => runner);
		}

		function createRunnerStat(label, value, populated = false) {
			const stat = document.createElement("span");
			stat.className = "runner-stat";
			if (populated) stat.dataset.populated = "true";
			const statLabel = document.createElement("span");
			statLabel.className = "runner-stat-label";
			statLabel.textContent = label;
			const statValue = document.createElement("span");
			statValue.className = "runner-stat-value";
			statValue.textContent = value;
			stat.append(statLabel, statValue);
			return stat;
		}

		function createRunnerSessions(runner, runnerIndex) {
			const sessions = document.createElement("section");
			sessions.className = "runner-sessions";
			sessions.id = `runner-sessions-${runnerIndex}`;
			sessions.dataset.runnerId = runner.id;
			sessions.tabIndex = -1;
			sessions.setAttribute("aria-label", `${runner.id} 的對話與工作階段`);

			const runnerSummary = document.createElement("div");
			runnerSummary.className = "runner-sessions-runner";
			const runnerSummaryIndex = document.createElement("span");
			runnerSummaryIndex.className = "runner-sessions-runner-index";
			runnerSummaryIndex.textContent = `R${padCount(runnerIndex + 1)}`;
			const runnerSummaryName = document.createElement("strong");
			runnerSummaryName.className = "runner-sessions-runner-name";
			runnerSummaryName.textContent = runner.id;
			runnerSummaryName.title = runner.id;
			runnerSummary.append(runnerSummaryIndex, runnerSummaryName);
			sessions.append(runnerSummary);

			const header = document.createElement("div");
			header.className = "runner-sessions-header";
			const threads = threadCount(runner.sessions);
			const legacy = runner.sessions.length - threads;
			const title = document.createElement("span");
			title.textContent = legacy ? "對話與工作階段" : "對話";
			const count = document.createElement("span");
			count.textContent = legacy ? `${padCount(threads)} + ${padCount(legacy)}` : padCount(threads);
			header.append(title, count);
			sessions.append(header);

			if (!runner.sessions.length) {
				const empty = document.createElement("p");
				empty.className = "runner-session-empty";
				empty.textContent = runner.managed ? "尚無已啟用對話" : "尚無工作階段";
				sessions.append(empty);
				return sessions;
			}

			const list = document.createElement("ol");
			list.className = "runner-session-list";
			let threadIndex = 0, legacyIndex = 0;
			for (const session of runner.sessions) {
				const row = document.createElement("li");
				row.className = "runner-session";
				const index = document.createElement("span");
				index.className = "runner-session-index";
				index.textContent = session.managed ? `T${padCount(++threadIndex)}` : `S${padCount(++legacyIndex)}`;
				const name = document.createElement("span");
				name.className = "session-name";
				name.textContent = session.name;
				name.title = session.name;
				const state = document.createElement("span");
				state.className = "state";
				state.dataset.state = session.state;
				state.textContent = session.state;
				if (session.managed) {
					const open = document.createElement("a");
					open.className = "secondary-button session-close";
					open.href = `/threads/${encodeURIComponent(session.threadId)}`;
					open.textContent = "開啟";
					open.title = `開啟對話 ${session.name}`;
					open.addEventListener("click", (event) => event.stopPropagation());
					row.append(index, name, state, open);
					list.append(row);
					continue;
				}
				const close = document.createElement("button");
				close.className = "secondary-button session-close";
				close.type = "button";
				close.textContent = "關閉";
				close.title = `停止 ${session.name} 的 pi 程序`;
				close.addEventListener("click", async (event) => {
					event.stopPropagation();
					close.disabled = true;
					const query = `runner=${encodeURIComponent(runner.id)}&session=${encodeURIComponent(session.name)}`;
					const response = await fetch(`/api/session?${query}`, { method: "DELETE", credentials: "same-origin" });
					if (!response.ok) {
						close.disabled = false;
						setStatus(`無法關閉 ${session.name}（${response.status}）。`, "error");
					}
				});
				row.append(index, name, state, close);
				list.append(row);
			}
			sessions.append(list);
			return sessions;
		}

		function createRunnerCard(runner, runnerIndex, isSelected) {
			const card = document.createElement("article");
			card.className = "runner-card";
			card.dataset.expanded = String(isSelected);
			const block = document.createElement("button");
			block.type = "button";
			block.className = "runner-block";
			block.dataset.runnerId = runner.id;
			block.setAttribute("aria-expanded", String(isSelected));
			block.setAttribute("aria-controls", "runner-sessions-" + runnerIndex);
			const identity = document.createElement("span");
			identity.className = "runner-identity";
			const title = document.createElement("strong");
			title.className = "runner-name";
			title.textContent = runner.id;
			const action = document.createElement("span");
			action.className = "runner-action";
			action.textContent = rowsLabel(runner.sessions) || "尚無已啟用的對話";
			identity.append(title, action);
			const presence = document.createElement("span");
			presence.className = "runner-presence";
			const online = document.createElement("span");
			online.className = "runner-online";
			online.textContent = "已連線";
			presence.append(online);
			const stats = document.createElement("span");
			stats.className = "runner-stats";
			stats.append(createRunnerStat("連線時間", elapsed(runner.connectedAt)));
			stats.title = dateTime(runner.connectedAt);
			block.append(identity, presence, stats);
			block.addEventListener("click", () => {
				selectedRunnerId = isSelected ? null : runner.id;
				renderDirectory(latestData);
			});
			card.append(block);
			if (isSelected) card.append(createRunnerSessions(runner, runnerIndex));
			return card;
		}

		function renderDirectory(data) {
			const focusedRunnerId = document.activeElement?.matches(".runner-block, .runner-sessions")
				? document.activeElement.dataset.runnerId
				: null;
			container.replaceChildren();
			const runners = visibleRunners(data.runners);
			const hasFilter = Boolean(filterInput.value.trim());
			resultsNote.textContent = hasFilter
				? `${data.runners.length} 個 Runner 中，有 ${runners.length} 個符合搜尋。`
				: `共 ${data.runners.length} 個已連線的 Runner。`;

			if (!runners.length) {
				if (!data.runners.length) selectedRunnerId = null;
				if (hasFilter && data.runners.length) {
					renderEmpty("找不到符合的項目", "試著搜尋其他 Runner 或工作階段名稱。", "R–Ø");
				} else {
					renderEmpty("尚無已連線的 Runner", "已連線至 Tower，正在等待 Runner 加入。", "R–Ø");
				}
				return;
			}

			const selectedRunner = runners.find((runner) =>
				runner.id === selectedRunnerId
			) ?? null;
			selectedRunnerId = selectedRunner?.id ?? null;
			const grid = document.createElement("div");
			grid.className = "runner-grid";
			grid.setAttribute("aria-label", "已連線 Runner");
			runners.forEach((runner) => {
				const runnerIndex = data.runners.indexOf(runner);
				grid.append(createRunnerCard(runner, runnerIndex, runner.id === selectedRunnerId));
			});
			container.append(grid);
			if (focusedRunnerId) {
				const focusTargets = [...grid.querySelectorAll(".runner-sessions, .runner-block")]
					.filter((element) => element.dataset.runnerId === focusedRunnerId);
				(focusTargets.find((element) => element.classList.contains("runner-sessions")) ?? focusTargets[0])
					?.focus({ preventScroll: true });
			}
		}

		function render(data) {
			latestData = data;
			setCounts(data.runners);
			renderDirectory(data);
			const rows = rowsLabel(data.runners.flatMap((runner) => runner.sessions));
			setStatus(
				data.runners.length
					? `${plural(data.runners.length, "runner")} 已連線${rows ? ` · ${rows}` : " · 尚無已啟用對話"}`
					: "已連線。尚無可用的 Runner。",
				"success",
			);
		}

		async function connect(id) {
			clearTimeout(timer);
			stream?.close();
			stream = null;
			try {
				const response = await fetch("/api/state", { cache: "no-store", credentials: "same-origin" });
				if (id !== pollId) return;
				if (response.status === 401) {
					const sessionExpired = document.body.dataset.authenticated === "true";
					document.body.dataset.authenticated = "false";
					setConnection("disconnected");
					setCounts();
					filterInput.disabled = true;
					refreshButton.disabled = true;
					if (authFailed) setStatus("存取權杖不正確，請檢查後再試。", "error");
					else if (sessionExpired) setStatus("登入已過期，請重新輸入 Tower 權杖。", "error");
					else setStatus("輸入 Tower 權杖以查看連線狀態。");
					pollingNote.textContent = "即時更新已停止";
					resultsNote.textContent = "登入後即可查看可用的 Runner。";
					renderEmpty(
						authFailed ? "無法登入" : "請先登入",
						"輸入 Tower 設定的存取權杖，即可查看 Runner 與對話。",
						authFailed ? "E–401" : "R–000",
					);
					authDetails.open = true;
					input.focus();
					return;
				}
				if (!response.ok) throw new Error(`State request failed (HTTP ${response.status}).`);
				const data = await response.json();
				if (id !== pollId) return;
				const wasAuthenticated = document.body.dataset.authenticated === "true";
				document.body.dataset.authenticated = "true";
				setConnection("connected");
				filterInput.disabled = false;
				refreshButton.disabled = false;
				render(data);
				pollingNote.textContent = `${new Date().toLocaleTimeString()} 更新 · 正在連線至即時更新`;
				if (!wasAuthenticated) authDetails.open = false;

				const events = new EventSource("/api/events");
				stream = events;
				events.onopen = () => {
					if (id !== pollId || stream !== events) return;
					setConnection("connected");
					pollingNote.textContent = "即時更新已連線";
				};
				events.onmessage = (event) => {
					if (id !== pollId || stream !== events) return;
					setConnection("connected");
					render(JSON.parse(event.data));
					pollingNote.textContent = `${new Date().toLocaleTimeString()} 更新 · 即時連線`;
				};
				events.onerror = () => {
					if (id !== pollId || stream !== events) return;
					setConnection("degraded");
					setStatus("即時更新已中斷，正在自動重新連線…", "error");
					pollingNote.textContent = "正在重新連線至即時更新";
				};
			} catch (error) {
				if (id !== pollId) return;
				setConnection("degraded");
				setStatus(error instanceof Error ? error.message : "無法讀取連線狀態。", "error");
				pollingNote.textContent = "正在自動重試";
				timer = setTimeout(() => connect(id), 2000);
			}
		}

		form.addEventListener("submit", () => {
			clearTimeout(timer);
			stream?.close();
			++pollId;
			setConnection("connecting");
			setStatus("正在檢查權杖並載入連線狀態…");
			pollingNote.textContent = "連線中";
		});

		document.addEventListener("pointerdown", (event) => {
			if (document.body.dataset.authenticated === "true" && authDetails.open && !authDetails.contains(event.target)) authDetails.open = false;
		});

		document.addEventListener("keydown", (event) => {
			if (document.body.dataset.authenticated !== "true" || event.key !== "Escape" || !authDetails.open) return;
			authDetails.open = false;
			authDetails.querySelector("summary").focus();
		});

		filterInput.addEventListener("input", () => renderDirectory(latestData));

		refreshButton.addEventListener("click", () => {
			if (document.body.dataset.authenticated !== "true") return;
			const id = ++pollId;
			setStatus("正在重新整理連線狀態…");
			pollingNote.textContent = "正在重新整理";
			connect(id);
		});

		const clock = document.querySelector("#clock");
		const updateClock = () => {
			const now = new Date();
			clock.dateTime = now.toISOString();
			clock.textContent = now.toLocaleTimeString(undefined, { hour12: false });
		};
		updateClock();
		setInterval(updateClock, 1000);

		const app = document.getElementById("app");
		const sidebar = document.getElementById("thread-sidebar");
		let drawer = null;
		let drawerTrigger = null;
		let viewportWidth = window.innerWidth;
		function closeDrawer() {
			if (!drawer) return;
			app.classList.remove("sidebar-open");
			drawer.removeAttribute("role");
			drawer.removeAttribute("aria-modal");
			for (const panel of app.children) panel.inert = false;
			document.getElementById("drawer-backdrop").hidden = true;
			drawer = null;
			drawerTrigger?.focus();
			updatePanelButtons();
		}
		function updatePanelButtons() {
			document.getElementById("sidebar-toggle").setAttribute("aria-expanded", String(window.innerWidth <= 700 ? drawer === sidebar : !app.classList.contains("sidebar-hidden")));
		}
		function togglePanel(panel, name, trigger) {
			if (window.innerWidth > 700) {
				app.classList.toggle(name + "-hidden");
				updatePanelButtons();
				return;
			}
			const wasOpen = drawer === panel;
			closeDrawer();
			if (wasOpen) return;
			drawer = panel;
			drawerTrigger = trigger;
			app.classList.add(name + "-open");
			panel.setAttribute("role", "dialog");
			panel.setAttribute("aria-modal", "true");
			for (const sibling of app.children) sibling.inert = sibling !== panel;
			document.getElementById("drawer-backdrop").hidden = false;
			updatePanelButtons();
			(panel.querySelector("button:not(:disabled), a[href], input:not(:disabled)") || panel).focus();
		}
		document.getElementById("sidebar-toggle").addEventListener("click", (event) => togglePanel(sidebar, "sidebar", event.currentTarget));
		for (const button of document.querySelectorAll("[data-close-panel]")) button.addEventListener("click", closeDrawer);
		document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);
		window.addEventListener("resize", () => {
			if (viewportWidth === window.innerWidth) return;
			viewportWidth = window.innerWidth;
			closeDrawer();
			updatePanelButtons();
		});
		document.addEventListener("keydown", (event) => {
			if (event.key.toLowerCase() === "k" && (event.metaKey || event.ctrlKey)) {
				event.preventDefault();
				const search = document.getElementById("runner-filter");
				if (search?.disabled) return;
				closeDrawer();
				search?.focus();
			}
			if (!drawer || document.querySelector("dialog[open]")) return;
			if (event.key === "Escape") { event.preventDefault(); closeDrawer(); }
			if (event.key !== "Tab" || !drawer) return;
			const focusable = [...drawer.querySelectorAll('a[href], button:not(:disabled), input:not(:disabled), select:not(:disabled), summary, [tabindex="0"]')].filter((element) => element.tabIndex >= 0 && element.getClientRects().length);
			const first = focusable[0], last = focusable.at(-1);
			if (!first) { event.preventDefault(); drawer.focus(); return; }
			if (event.shiftKey && (document.activeElement === first || document.activeElement === drawer)) { event.preventDefault(); last.focus(); }
			else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
		});
		updatePanelButtons();

		document.getElementById("logout").addEventListener("click", async () => {
			try {
				const response = await fetch("/api/logout", { method: "POST", headers: { "x-pi-csrf": "1" } });
				if (!response.ok) throw new Error("登出失敗（" + response.status + "）。");
				location.href = "/";
			} catch (error) { setStatus(error.message, "error"); }
		});
		window.addEventListener("pagehide", () => { clearTimeout(timer); stream?.close(); });
		setConnection("connecting");
		setStatus(authFailed ? "正在確認登入失敗原因…" : "正在恢復登入狀態…");
		pollingNote.textContent = "連線中";
		connect(++pollId);
	</script>
</body>
</html>
