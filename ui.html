<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>pi-tower state</title>
	<style>
		:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
		body { max-width: 70rem; margin: auto; padding: 1.5rem; line-height: 1.5; }
		h1 { margin-bottom: .5rem; }
		form { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; margin: 1.5rem 0; }
		label { display: grid; gap: .3rem; flex: 1 1 16rem; }
		input, button { font: inherit; padding: .6rem .75rem; border: 1px solid #888; border-radius: .35rem; }
		button { cursor: pointer; }
		:focus-visible { outline: 3px solid #2684ff; outline-offset: 2px; }
		#status { min-height: 1.5rem; }
		.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(18rem, 100%), 1fr)); gap: 1rem; }
		article { border: 1px solid #8888; border-radius: .5rem; padding: 1rem; }
		article h2 { margin: 0; overflow-wrap: anywhere; }
		.meta { color: #777; font-size: .9rem; }
		ul { list-style: none; padding: 0; margin-bottom: 0; }
		li { display: flex; justify-content: space-between; gap: 1rem; padding: .35rem 0; border-top: 1px solid #8884; }
		.badge { border-radius: 1rem; padding: .1rem .55rem; font-size: .85rem; background: #7773; }
		.badge.attached { background: #16803a33; }
		.badge.opening { background: #b7791f33; }
	</style>
</head>
<body>
	<main>
		<h1>pi-tower state</h1>
		<p>View connected runners and their sessions.</p>
		<form id="auth-form">
			<label for="token">Password token<input id="token" name="token" type="password" required autocomplete="off"></label>
			<button type="submit">Connect</button>
		</form>
		<p id="status" role="status" aria-live="polite">Enter the tower token to load state.</p>
		<section id="runners" class="grid" aria-label="Runners"></section>
	</main>
	<script>
		const form = document.querySelector("#auth-form");
		const input = document.querySelector("#token");
		const status = document.querySelector("#status");
		const container = document.querySelector("#runners");
		let token = "";
		let timer;
		let pollId = 0;

		function showStatus(message) {
			status.textContent = message;
		}

		function render(data) {
			container.replaceChildren();
			if (!data.runners.length) {
				showStatus("No runners are connected.");
				return;
			}
			showStatus(`${data.runners.length} runner${data.runners.length === 1 ? "" : "s"} connected.`);
			for (const runner of data.runners) {
				const card = document.createElement("article");
				const heading = document.createElement("h2");
				heading.textContent = runner.id;
				const connected = document.createElement("p");
				connected.className = "meta";
				connected.append("Connected ");
				const time = document.createElement("time");
				time.dateTime = runner.connectedAt;
				time.textContent = new Date(runner.connectedAt).toLocaleString();
				connected.append(time);
				card.append(heading, connected);
				if (!runner.sessions.length) {
					const empty = document.createElement("p");
					empty.textContent = "No sessions.";
					card.append(empty);
				} else {
					const list = document.createElement("ul");
					for (const session of runner.sessions) {
						const item = document.createElement("li");
						const name = document.createElement("span");
						name.textContent = session.name;
						const badge = document.createElement("span");
						badge.className = `badge ${session.state}`;
						badge.textContent = session.state;
						item.append(name, badge);
						list.append(item);
					}
					card.append(list);
				}
				container.append(card);
			}
		}

		async function poll(id) {
			try {
				const response = await fetch("/api/state", {
					headers: { Authorization: `Bearer ${token}` },
					cache: "no-store",
				});
				if (id !== pollId) return;
				if (response.status === 401) {
					token = "";
					container.replaceChildren();
					showStatus("Unauthorized. Enter the correct token.");
					input.focus();
					return;
				}
				if (!response.ok) throw new Error(`Request failed (${response.status}).`);
				const data = await response.json();
				if (id !== pollId) return;
				render(data);
			} catch (error) {
				if (id !== pollId) return;
				showStatus(error instanceof Error ? error.message : "Unable to load state.");
			}
			if (token) timer = setTimeout(() => poll(id), 2000);
		}

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			clearTimeout(timer);
			const id = ++pollId;
			token = input.value;
			input.value = "";
			container.replaceChildren();
			showStatus("Loading state…");
			poll(id);
		});
	</script>
</body>
</html>
