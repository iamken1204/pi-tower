# Tower behind a Cloudflare Tunnel: no host port exposed, TLS terminates at Cloudflare.
# In the Zero Trust dashboard, point the tunnel's public hostname at http://tower:9000,
# then use wss://<your-hostname> as the tower URL everywhere.
services:
  tower:
    build: .
    environment:
      PI_TOWER_TOKEN: ${PI_TOWER_TOKEN:?set PI_TOWER_TOKEN in .env}
      PI_TOWER_IDLE_TTL: ${PI_TOWER_IDLE_TTL:-30m}
      PI_TOWER_DATA_DIR: ${PI_TOWER_DATA_DIR:-/data}
      PI_TOWER_SUBJECT_HEADER: ${PI_TOWER_SUBJECT_HEADER:-}
      PI_MANAGED_TEXT_BYTES: ${PI_MANAGED_TEXT_BYTES:-262144}
      PI_TOWER_MANAGED_FRAME_BYTES: ${PI_TOWER_MANAGED_FRAME_BYTES:-524288}
      PI_TOWER_MAX_SNAPSHOT_BYTES: ${PI_TOWER_MAX_SNAPSHOT_BYTES:-67108864}
      PI_TOWER_MAX_SNAPSHOT_TOTAL_BYTES: ${PI_TOWER_MAX_SNAPSHOT_TOTAL_BYTES:-1073741824}
      PI_TOWER_MIN_FREE_BYTES: ${PI_TOWER_MIN_FREE_BYTES:-268435456}
      PI_TOWER_MAX_UPLOADS: ${PI_TOWER_MAX_UPLOADS:-2}
      PI_TOWER_VIEWER_BUFFER_BYTES: ${PI_TOWER_VIEWER_BUFFER_BYTES:-1048576}
    volumes:
      - tower-data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - tower
    restart: unless-stopped

volumes:
  tower-data:
