<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcf9f7">
  <title>Runner collaboration · pi tower</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#conversation">跳到對話</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="對話導覽">
      <header class="sidebar-header">
        <a class="brand" href="#collaboration" aria-label="pi tower 首頁"><span data-icon="tower"></span><span>pi <b>tower</b></span></a>
        <div class="header-actions">
          <button class="icon-button" id="search-toggle" title="搜尋對話 (⌘K)" aria-label="搜尋對話"><span data-icon="search"></span></button>
          <button class="icon-button compose-button" id="new-thread" title="新增對話" aria-label="新增對話"><span data-icon="compose"></span></button>
          <button class="icon-button mobile-close" id="sidebar-close" aria-label="關閉對話導覽"><span data-icon="x"></span></button>
        </div>
      </header>

      <div class="workspace-label"><span class="status-dot"></span> Personal workspace <span class="workspace-count">3 runners</span></div>
      <div class="search-wrap" id="search-wrap" hidden><span data-icon="search"></span><input id="search" type="search" placeholder="搜尋對話或專案…" aria-label="搜尋對話或專案"><kbd>esc</kbd></div>
      <nav class="thread-nav" id="thread-nav" aria-label="依專案分組的對話"></nav>
      <div class="sidebar-bottom">
        <button class="archive-button" id="inactive-toggle" aria-expanded="false"><span data-icon="archive"></span><span>已休眠的對話</span><span class="count">2</span><span class="tiny-icon" data-icon="chevron"></span></button>
        <div class="inactive-threads" id="inactive-threads" hidden></div>
        <div class="sidebar-footer">
          <button class="footer-tab active" id="threads-tab" aria-pressed="true"><span data-icon="threads"></span>對話</button>
          <button class="footer-tab" id="runners-tab" aria-pressed="false"><span data-icon="monitor"></span>Runners<span class="online-count">3</span></button>
        </div>
        <div class="account-row"><span class="avatar">K</span><span class="account-name">kettan<small>Personal workspace</small></span><span class="preview-label" title="所有內容都是示範資料，操作不會連線到 Runner">靜態預覽</span></div>
      </div>
    </aside>

    <main class="main-panel" id="main-panel">
      <header class="main-header">
        <button class="icon-button" id="sidebar-toggle" aria-label="收合對話導覽" aria-controls="sidebar" aria-expanded="true"><span data-icon="panel-left"></span></button>
        <span class="thread-symbol" data-icon="diamond"></span>
        <h1 id="header-title">Runner collaboration</h1>
        <span class="header-state" id="header-state"><span class="status-dot"></span>已完成</span>
        <div class="main-header-actions">
          <button class="icon-button" id="thread-menu-button" aria-label="對話選項" aria-expanded="false" aria-controls="thread-menu"><span data-icon="more"></span></button>
          <span class="header-divider"></span>
          <button class="icon-button" id="inspector-toggle" aria-label="收合詳細資訊" aria-controls="inspector" aria-expanded="true"><span data-icon="panel-right"></span></button>
        </div>
        <div class="dropdown" id="thread-menu" hidden>
          <button id="rename-thread"><span data-icon="edit"></span>重新命名</button>
          <button id="copy-thread"><span data-icon="link"></span>複製預覽連結</button>
        </div>
      </header>

      <div class="conversation-scroll" id="conversation-scroll">
        <div class="conversation" id="conversation" tabindex="-1" aria-label="對話內容"></div>
      </div>

      <section class="composer-area" id="composer-area" aria-label="輸入訊息">
        <div class="composer-context"><span class="status-dot" id="composer-dot"></span><span id="composer-runner">macbook-pro</span><span class="context-slash">/</span><span data-icon="folder"></span><span id="composer-project">pi-tower</span><span class="saved-note" id="saved-note"><span data-icon="cloud-check"></span>已同步</span></div>
        <form class="composer" id="composer">
          <label class="sr-only" for="prompt">傳送訊息</label>
          <textarea id="prompt" rows="2" placeholder="繼續這段對話…"></textarea>
          <div class="composer-toolbar">
            <span class="composer-hint" id="composer-hint">每段對話，都在原本的工作環境繼續。</span>
            <div class="send-controls"><button class="steer-button" id="steer" type="button" hidden>調整目前任務</button><button class="icon-button stop-button" id="stop" type="button" aria-label="停止示範任務" title="停止任務" hidden><span data-icon="stop"></span></button><button class="send-button" id="send" type="submit" aria-label="傳送訊息" title="傳送訊息 (Enter)" disabled><span data-icon="arrow-up"></span></button></div>
          </div>
        </form>
        <div class="composer-footnote"><span id="composer-status">示範資料 · 訊息僅保留在本頁</span><span><kbd>↵</kbd> 傳送 <span class="key-separator">·</span> <kbd>shift ↵</kbd> 換行</span></div>
      </section>

      <section class="runners-view" id="runners-view" hidden aria-label="Runner 總覽"></section>
    </main>

    <aside class="inspector" id="inspector" aria-label="對話詳細資訊">
      <header class="inspector-header">
        <div class="inspector-tabs" role="tablist" aria-label="詳細資訊">
          <button class="inspector-tab active" id="tab-context" role="tab" aria-selected="true" aria-controls="panel-context" data-tab="context"><span data-icon="folder"></span>工作環境</button>
          <button class="inspector-tab" id="tab-tasks" role="tab" aria-selected="false" aria-controls="panel-tasks" tabindex="-1" data-tab="tasks"><span data-icon="branch"></span>協作<span class="tab-count" id="task-count">2</span></button>
        </div>
        <button class="icon-button mobile-close" id="inspector-close" aria-label="關閉詳細資訊"><span data-icon="x"></span></button>
      </header>
      <div class="inspector-content" id="panel-context" role="tabpanel" aria-labelledby="tab-context"></div>
      <div class="inspector-content" id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden></div>
      <footer class="inspector-footer"><span data-icon="cloud-check"></span><span>對話與執行紀錄已同步</span><span class="status-dot"></span></footer>
    </aside>
  </div>

  <button class="drawer-backdrop" id="drawer-backdrop" aria-label="關閉側欄" hidden></button>
  <dialog class="thread-dialog" id="thread-dialog" aria-labelledby="dialog-title">
    <form id="thread-form">
      <div class="dialog-heading"><span class="dialog-icon" data-icon="compose"></span><button class="icon-button" id="dialog-close" type="button" aria-label="關閉"><span data-icon="x"></span></button></div>
      <h2 id="dialog-title">開始一段對話</h2>
      <p id="dialog-description">選擇 Runner 和工作目錄，接著交代任務。</p>
      <div id="new-thread-fields"><label for="new-runner">Runner</label><select id="new-runner"><option value="macbook-pro">macbook-pro · macOS</option><option value="iscoollab-pc">iscoollab-pc · Windows</option><option value="build-linux">build-linux · Linux</option></select><label for="new-project">工作目錄</label><select id="new-project"></select></div>
      <label for="new-title">對話名稱</label><input id="new-title" placeholder="例如：檢查 Windows 建置" maxlength="100" required>
      <p class="dialog-note">靜態預覽：這次操作只會新增本頁的示範對話。</p>
      <button class="primary-button" id="dialog-submit" type="submit">建立對話<span data-icon="arrow-right"></span></button>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
