<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1120"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="420" rx="16"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="16" fill="url(#bg)" stroke="#22304e"/>

  <g clip-path="url(#frame)">
    <!-- radar arcs around the tower -->
    <g fill="none" stroke="#1b2a47" stroke-width="1.5">
      <circle cx="790" cy="340" r="150"/>
      <circle cx="790" cy="340" r="215"/>
      <circle cx="790" cy="340" r="280"/>
    </g>

    <!-- title block -->
    <text x="72" y="116" font-size="54" font-weight="700" fill="#f2f6fc">pi-tower</text>
    <text x="72" y="156" font-size="17" fill="#9fb3d1">Dispatch prompts to pi agents on any machine, through one tiny relay.</text>

    <!-- strength pills -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb3d1">
      <rect x="72" y="184" width="222" height="28" rx="14" fill="none" stroke="#2b3b5e"/>
      <text x="86" y="202">outbound-only · NAT friendly</text>
      <rect x="308" y="184" width="150" height="28" rx="14" fill="none" stroke="#2b3b5e"/>
      <text x="322" y="202">one shared token</text>
      <rect x="472" y="184" width="188" height="28" rx="14" fill="none" stroke="#2b3b5e"/>
      <text x="486" y="202">~300 lines, pure relay</text>
    </g>

    <!-- laptop terminal -->
    <g>
      <rect x="72" y="252" width="400" height="118" rx="10" fill="#0a0f1c" stroke="#26334f"/>
      <circle cx="92" cy="274" r="5" fill="#ff5f57"/>
      <circle cx="110" cy="274" r="5" fill="#febc2e"/>
      <circle cx="128" cy="274" r="5" fill="#28c840"/>
      <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13">
        <text x="90" y="308" fill="#d7e3f4">$ <tspan fill="#f0a63b">pi-task</tspan> win-test-1 <tspan fill="#8fd18a">"debug the failing job"</tspan></text>
        <text x="90" y="334" fill="#6f81a3">→ a full pi agent answers from that machine</text>
        <rect x="90" y="346" width="8" height="14" fill="#d7e3f4">
          <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- client → tower link -->
    <path d="M 472 300 C 600 296, 660 330, 766 332" fill="none" stroke="#57b6ff" stroke-width="2" stroke-dasharray="7 9" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="3s" repeatCount="indefinite"/>
    </path>
    <text x="600" y="284" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#57b6ff" opacity="0.85">wss</text>

    <!-- tower -->
    <g>
      <ellipse cx="790" cy="342" rx="60" ry="8" fill="#16223c"/>
      <polygon points="770,340 810,340 802,190 778,190" fill="#2a3854" stroke="#3b4c74"/>
      <line x1="774" y1="290" x2="806" y2="290" stroke="#3b4c74" stroke-width="3"/>
      <line x1="776" y1="245" x2="804" y2="245" stroke="#3b4c74" stroke-width="3"/>
      <rect x="756" y="148" width="68" height="46" rx="10" fill="#f0a63b"/>
      <text x="790" y="181" font-size="28" font-weight="700" fill="#131a2b" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">π</text>
      <line x1="790" y1="148" x2="790" y2="112" stroke="#8fa4c8" stroke-width="2"/>
      <circle cx="790" cy="106" r="11" fill="#ff6b6b" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="106" r="5" fill="#ff6b6b">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- tower → runner links -->
    <g fill="none" stroke="#f0a63b" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.7">
      <path d="M 824 166 C 880 150, 920 128, 981 124">
        <animate attributeName="stroke-dashoffset" values="0;-56" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 824 176 C 890 186, 930 206, 981 210">
        <animate attributeName="stroke-dashoffset" values="0;-56" dur="3.1s" repeatCount="indefinite"/>
      </path>
      <path d="M 830 192 C 890 240, 930 286, 981 296">
        <animate attributeName="stroke-dashoffset" values="0;-56" dur="3.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- runner cards -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
      <g>
        <rect x="985" y="96" width="190" height="56" rx="12" fill="#101a30" stroke="#26334f"/>
        <circle cx="1005" cy="124" r="5" fill="#3fd68f"/>
        <text x="1018" y="120" font-size="14" font-weight="700" fill="#e6edf7">win-test-1</text>
        <text x="1018" y="138" font-size="11.5" fill="#7d90b4">Windows · GitLab CI</text>
      </g>
      <g>
        <rect x="985" y="182" width="190" height="56" rx="12" fill="#101a30" stroke="#26334f"/>
        <circle cx="1005" cy="210" r="5" fill="#3fd68f"/>
        <text x="1018" y="206" font-size="14" font-weight="700" fill="#e6edf7">mac-ci-02</text>
        <text x="1018" y="224" font-size="11.5" fill="#7d90b4">macOS · build farm</text>
      </g>
      <g>
        <rect x="985" y="268" width="190" height="56" rx="12" fill="#101a30" stroke="#26334f"/>
        <circle cx="1005" cy="296" r="5" fill="#3fd68f"/>
        <text x="1018" y="292" font-size="14" font-weight="700" fill="#e6edf7">lab-linux</text>
        <text x="1018" y="310" font-size="11.5" fill="#7d90b4">Linux · lab box</text>
      </g>
    </g>

    <!-- footer install hint -->
    <text x="1160" y="398" text-anchor="end" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#5c6f93">pi install npm:pi-tower</text>
  </g>
</svg>
